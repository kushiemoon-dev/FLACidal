name: star-history

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 .github/scripts/star_history.py "${{ github.repository }}" "$RUNNER_TEMP/star-history.svg"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to the star-history branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main is protected and its checks never run on a PR opened with the
          # default token, so the SVG lives on its own branch that the README links to.
          git checkout --orphan star-history
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/star-history.svg" star-history.svg
          git add star-history.svg
          git commit -m "chore: refresh star history"
          git push -f origin star-history
