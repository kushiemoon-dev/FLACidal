name: star-history

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 .github/scripts/star_history.py "${{ github.repository }}" docs/star-history.svg
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Open PR with the refreshed history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/star-history.svg
          git diff --cached --quiet && exit 0
          git checkout -b star-history-update
          git commit -m "chore: refresh star history"
          # main is protected; push the update to its own branch and open
          # a PR instead of pushing straight to main (avoids needing a PAT).
          git push -f origin star-history-update
          gh pr create --title "chore: refresh star history" \
            --body "Automated weekly star history refresh." \
            --base main --head star-history-update \
            || echo "PR already open, branch updated"
